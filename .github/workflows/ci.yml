name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit and data tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run size

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        # Linux runners have a working WebKit build, so iOS Safari is covered here.
        run: npx playwright test
        env:
          CI: 'true'
          PW_WEBKIT: '1'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publishing is gated on `verify` passing, so a broken commit cannot reach
  # production. Inert until the Cloudflare secrets are set — it reports a
  # notice and succeeds rather than failing the run.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether deployment is configured
        id: config
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloudflare secrets are not set, so nothing was published. See DEPLOY.md to enable automatic deploys.'
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      - run: npm run build
        if: steps.config.outputs.ready == 'true'

      - name: Publish to Cloudflare Pages
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shnayim-mikra --branch=main
